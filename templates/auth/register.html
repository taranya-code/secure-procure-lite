<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — SecureProcure Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800 py-8">
<div class="w-full max-w-md px-4">
  <div class="text-center mb-6">
    <h1 class="text-3xl font-bold text-white">Secure<span class="text-emerald-400">Procure</span></h1>
    <p class="text-slate-400 mt-1 text-sm">Enterprise Procurement Portal</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="mb-4 px-4 py-3 rounded-lg text-sm
    {% if cat == 'danger' %}bg-red-900/50 text-red-300{% else %}bg-blue-900/50 text-blue-300{% endif %}">
    {{ msg }}
  </div>
  {% endfor %}
  {% endwith %}

  <div class="bg-white rounded-2xl shadow-xl p-8">
    <h2 class="text-xl font-semibold mb-1">Create Account</h2>
    <p class="text-sm text-gray-500 mb-6">Register to access the procurement portal</p>
    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
        <input type="text" name="name" required class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
        <input type="email" name="email" required class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password * (min 8 chars)</label>
        <input type="password" name="password" required minlength="8" class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Role *</label>
        <select name="role" id="role-select" onchange="toggleCompany()" class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 outline-none">
          <option value="PROCUREMENT_OFFICER">Procurement Officer</option>
          <option value="APPROVER">Approver / Manager</option>
          <option value="VENDOR">Vendor</option>
          <option value="AUDITOR">Auditor</option>
        </select>
      </div>
      <div id="company-field" class="hidden">
        <label class="block text-sm font-medium text-gray-700 mb-1">Company Name *</label>
        <input type="text" name="company_name" class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 outline-none"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Department (optional)</label>
        <input type="text" name="department" class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 outline-none"/>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm">
        Create Account
      </button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
      Already have an account? <a href="/login" class="text-blue-600 hover:underline">Sign in</a>
    </p>
    <p class="text-center mt-2">
      <a href="/login" class="text-sm text-gray-400 hover:text-gray-600">← Cancel</a>
    </p>
  </div>
</div>
<script>
function toggleCompany() {
  const role = document.getElementById('role-select').value;
  document.getElementById('company-field').classList.toggle('hidden', role !== 'VENDOR');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') window.location.href = '/login';
});
</script>
</body>
</html>
