{% extends "base.html" %}
{% block title %}New Purchase Request{% endblock %}
{% block page_header %}
  <div style="font-size: 16px; font-weight: 700; color: var(--text-primary);">New Purchase Request</div>
{% endblock %}
{% block content %}
<div style="max-width: 720px;">
  <div class="card" style="padding: 28px;">
    <form method="post" id="req-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div style="grid-column: 1 / -1;">
          <label class="form-label">Title *</label>
          <input type="text" name="title" required class="form-input" placeholder="e.g. Server Infrastructure Upgrade Q3 2025"/>
        </div>
        <div>
          <label class="form-label">Category *</label>
          <input type="text" name="category" required class="form-input" placeholder="e.g. IT Hardware"/>
        </div>
        <div>
          <label class="form-label">Estimated Budget *</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 14px; font-weight: 600;">$</span>
            <input type="number" name="estimated_budget" required min="1" step="0.01" class="form-input" placeholder="50,000" style="padding-left: 24px;"/>
          </div>
        </div>
        <div>
          <label class="form-label">Currency</label>
          <select name="currency" class="form-input">
            <option value="USD">USD — US Dollar</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="INR">INR — Indian Rupee</option>
          </select>
        </div>
        <div>
          <label class="form-label">Urgency</label>
          <select name="urgency" class="form-input">
            <option value="LOW">LOW</option>
            <option value="NORMAL" selected>NORMAL</option>
            <option value="HIGH">HIGH</option>
            <option value="CRITICAL">CRITICAL</option>
          </select>
        </div>
        <div style="grid-column: 1 / -1;">
          <label class="form-label">Description <span style="font-size: 11px; color: var(--text-faint); font-weight: 400;">(optional)</span></label>
          <textarea name="description" rows="2" class="form-input" placeholder="Justification, project context, or requirements…"></textarea>
        </div>
      </div>

      <!-- Line items -->
      <div style="margin-bottom: 20px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <div>
            <label class="form-label" style="margin-bottom: 0;">Line Items *</label>
            <div style="font-size: 11px; color: var(--text-faint); margin-top: 2px;">At least one item is required</div>
          </div>
          <button type="button" onclick="addItem()" class="btn btn-ghost btn-sm">+ Add Item</button>
        </div>

        <!-- Header row -->
        <div style="display: grid; grid-template-columns: 1fr 70px 80px 1fr 32px; gap: 6px; margin-bottom: 6px; padding: 0 2px;">
          <span style="font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em;">Item Name</span>
          <span style="font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em;">Qty</span>
          <span style="font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em;">Unit</span>
          <span style="font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em;">Specifications</span>
          <span></span>
        </div>

        <div id="items-container" style="display: flex; flex-direction: column; gap: 6px;">
          <div class="item-row" style="display: grid; grid-template-columns: 1fr 70px 80px 1fr 32px; gap: 6px; align-items: center;">
            <input type="text" name="item_name[]" placeholder="e.g. Dell PowerEdge R740" required class="form-input"/>
            <input type="number" name="quantity[]" placeholder="Qty" value="1" min="0.01" step="0.01" class="form-input" style="text-align: center;"/>
            <input type="text" name="unit[]" placeholder="Unit" value="pcs" class="form-input"/>
            <input type="text" name="specifications[]" placeholder="Optional specs" class="form-input"/>
            <div></div>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid #f1f5f9;">
        <a href="/requests" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Create Request</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function addItem() {
  const container = document.getElementById('items-container');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.style.cssText = 'display:grid;grid-template-columns:1fr 70px 80px 1fr 32px;gap:6px;align-items:center;';
  div.innerHTML = `
    <input type="text" name="item_name[]" placeholder="Item name" required class="form-input"/>
    <input type="number" name="quantity[]" placeholder="Qty" value="1" min="0.01" step="0.01" class="form-input" style="text-align:center;"/>
    <input type="text" name="unit[]" placeholder="Unit" value="pcs" class="form-input"/>
    <input type="text" name="specifications[]" placeholder="Optional specs" class="form-input"/>
    <button type="button" onclick="this.closest('.item-row').remove()" class="btn btn-ghost btn-sm" style="color:#ef4444;padding:6px 8px;">✕</button>
  `;
  container.appendChild(div);
}
</script>
{% endblock %}
